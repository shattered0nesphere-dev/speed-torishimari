<!doctype html><html lang="ja"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="theme-color" content="#0b5cab"><link rel="manifest" href="manifest.webmanifest"><link rel="apple-touch-icon" href="icons/icon-180.png"><link rel="stylesheet" href="style.css"><title>速度取締り情報</title></head><body><header><h1>速度取締り情報</h1><div id="status">起動時に公式情報を確認します</div></header><main><section><h2>地域を選択</h2><div class="row"><label>都道府県<select id="pref"></select></label><label>市区町村<input id="city" list="cities" placeholder="例：神戸市"><datalist id="cities"></datalist></label></div><button id="register">この地域を登録（最大20件）</button><div id="selected"></div></section><section><div class="title"><h2>警察公式の速度取締り情報</h2><button id="refresh">更新</button></div><div id="official"></div></section><section><h2>X（旧Twitter）</h2><p>警察公式情報とは別にXで検索します。</p><button id="xsearch">選択地域をXで検索</button></section><section><h2>Google Maps</h2><button id="maps">選択地域をGoogle Mapsで開く</button></section><section class="small"><p>警察等が公開している速度管理・速度取締り情報を確認するためのWebアプリです。実際の取締り場所・日時を保証するものではありません。</p></section></main><script src="app.js"></script></body></html>
